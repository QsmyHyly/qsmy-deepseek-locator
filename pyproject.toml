[build-system]
# setuptools 而不是 hatchling：不额外引入构建后端依赖。
# 下限抬到 77 是为了 PEP 639 的 SPDX 许可证写法（license = "MIT" + license-files）：
# 旧写法 license = { text = "..." } 在 setuptools 84 上已报弃用（截止 2027-02-18），
# 而 PEP 639 明确允许 PyPI 拒绝带弃用许可证标识的上传，不值得押在上面。
# 本机开发环境的 setuptools 65.5 低于这个下限也没关系：python -m build 与 pip install
# 默认都开构建隔离，会自动下载满足下限的 setuptools。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsmy-deepseek-locator"
version = "0.1.2"
description = "用 DeepSeek 视觉模型做物体定位：一张图 + 一句话，得到归一化坐标（bbox/point）与中文名称，可直接打标出图。"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"              # PEP 639 SPDX 表达式；写了它就不能再放 License :: 分类器
license-files = ["LICENSE"]
authors = [{ name = "qsmy" }]
keywords = ["deepseek", "vision", "vlm", "object-localization", "grounding", "multimodal", "annotation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Multimedia :: Graphics",
]
# 必装依赖刻意只有两个：Pillow 与 requests。
# openai 降级为可选 extra（本次改动；与仓内其余「0.1.2 -> 0.1.3 等价重构」的说法同指一批未发布的工作）：
# 它依赖 jiter 与 pydantic-core 两个 **Rust 扩展**，
# 二者都没有 Android/aarch64 wheel（pip install --dry-run openai 实测报
# "Target triple not supported by rustup"），于是安卓上「照文档装一遍」直接装不上。
# 而本库不装它也能完整使用 —— http_client.RequestsVisionClient 是纯 requests 的同义实现。
dependencies = [
  "Pillow>=9.5",    # 图像加载 / 打标绘制
  "requests>=2.28", # 图片 URL 下载 + 裸 HTTP 客户端
]

[project.optional-dependencies]
# DeepSeek 走 OpenAI 兼容协议。装了它 Locator 默认就用 DeepSeekVisionClient（有重试与连接池）。
openai = ["openai>=1.30"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=6.0"]  # 后两个是发版用：python -m build / twine check

[project.urls]
Homepage = "https://github.com/QsmyHyly/qsmy-deepseek-locator"
Repository = "https://github.com/QsmyHyly/qsmy-deepseek-locator"
Issues = "https://github.com/QsmyHyly/qsmy-deepseek-locator/issues"

[project.scripts]
# 一个入口两个用法：qsmy-deepseek-locator <图片> ...  /  qsmy-deepseek-locator bench ...
qsmy-deepseek-locator = "qsmy_deepseek_locator.cli:main"

[tool.setuptools.packages.find]
# include 白名单：不写的话，以后 src/ 下多出任何目录都会被当成包打进 wheel
# （默认 namespaces = true，没有 __init__.py 的目录也算命名空间包）。
where = ["src"]
include = ["qsmy_deepseek_locator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
