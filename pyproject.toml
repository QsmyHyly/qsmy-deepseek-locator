[build-system]
# setuptools 而不是 hatchling：本机 setuptools 65.5 已就位，editable 安装（PEP 660）开箱可用，
# 不额外引入构建后端依赖。本机 pip 22.3.1 也满足 editable 的最低要求。
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsmy-deepseek-locator"
version = "0.1.0"
description = "用 DeepSeek 视觉模型做物体定位：一张图 + 一句话，得到归一化坐标（bbox/point）与中文名称，可直接打标出图。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "qsmy" }]
keywords = ["deepseek", "vision", "vlm", "object-localization", "grounding", "multimodal", "annotation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "openai>=1.30",   # DeepSeek 走 OpenAI 兼容协议
  "Pillow>=9.5",    # 图像加载 / 打标绘制
  "requests>=2.28", # 图片 URL 下载
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/QsmyHyly/qsmy-deepseek-locator"

[project.scripts]
# 一个入口两个用法：qsmy-deepseek-locator <图片> ...  /  qsmy-deepseek-locator bench ...
qsmy-deepseek-locator = "qsmy_deepseek_locator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
